apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: qr-saas
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: qr-saas
type: Opaque
# ──────────────────────────────────────────────────────
# IMPORTANT: Replace these placeholder values before deploying!
# Generate real secrets:
#   openssl rand -base64 32   (for APP_SECRET, JWT_SECRET)
#
# To create from literal values instead of this file:
#   kubectl create secret generic api-secrets -n qr-saas \
#     --from-literal=APP_SECRET=xxx \
#     --from-literal=JWT_SECRET=xxx \
#     --from-literal=RAZORPAY_KEY_ID=xxx \
#     --from-literal=RAZORPAY_KEY_SECRET=xxx \
#     --from-literal=RAZORPAY_WEBHOOK_SECRET=xxx \
#     --from-literal=POSTGRES_PASSWORD=xxx
# ──────────────────────────────────────────────────────
stringData:
  APP_SECRET: "CHANGE-ME-generate-with-openssl-rand"
  JWT_SECRET: "CHANGE-ME-generate-with-openssl-rand"
  RAZORPAY_KEY_ID: "rzp_test_xxxxx"
  RAZORPAY_KEY_SECRET: "CHANGE-ME"
  RAZORPAY_WEBHOOK_SECRET: "CHANGE-ME"
  POSTGRES_PASSWORD: "qr"
