---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: qr-saas
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: qr-saas
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: qr-saas
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: qr-saas
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: qr-saas
    spec:
      containers:
        - name: frontend
          # Replace with your registry: e.g., docker.io/youruser/qr-saas-web:latest
          image: qr-saas-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
