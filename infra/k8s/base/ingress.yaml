apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qr-saas-ingress
  namespace: qr-saas
  labels:
    app.kubernetes.io/part-of: qr-saas
  annotations:
    # ── Nginx Ingress Controller ─────────────────────
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Enable CORS on the API host so the frontend can call it
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://qr.santhira.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
    # Enable if using cert-manager for TLS:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - qr.santhira.com
  #       - qr.api.santhira.com
  #     secretName: qr-saas-tls
  rules:
    # ── Frontend: qr.santhira.com ────────────────────
    - host: qr.santhira.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
    # ── API: qr.api.santhira.com ─────────────────────
    - host: qr.api.santhira.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: 8000
