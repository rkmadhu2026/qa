apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qr-saas

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - frontend.yaml
  - ingress.yaml
  # db-migrate-job.yaml is applied separately by deploy.sh
  # because it needs the db-migrations ConfigMap created from the actual SQL file

commonLabels:
  app.kubernetes.io/managed-by: kustomize

images:
  - name: qr-saas-api
    newName: qr-saas-api       # Override with: kustomize edit set image qr-saas-api=myregistry/qr-saas-api:v1.0
    newTag: latest
  - name: qr-saas-web
    newName: qr-saas-web
    newTag: latest
