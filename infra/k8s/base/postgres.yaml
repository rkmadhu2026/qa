---
# ── Service (headless for StatefulSet) ───────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: qr-saas
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: qr-saas
spec:
  clusterIP: None          # headless — StatefulSet requirement
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP

---
# ── ConfigMap for init SQL ───────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: qr-saas
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: qr-saas
data:
  001_init.sql: |
    -- This will be populated from the migration file.
    -- In production, mount the real SQL or use the db-migrate Job instead.
    -- See: infra/k8s/base/db-migrate-job.yaml

---
# ── StatefulSet ──────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: qr-saas
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: qr-saas
spec:
  serviceName: postgres-svc
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: qr-saas
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "qr"
            - name: POSTGRES_DB
              value: "qrsaas"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "qr", "-d", "qrsaas"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "qr", "-d", "qrsaas"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
